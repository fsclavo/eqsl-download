name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build AppImage (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          fi
          echo "Build version: $(cat VERSION)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils file python3-tk

      - name: Build AppImage
        run: bash packaging/linux/build_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: Releases/*.AppImage
          if-no-files-found: error

  windows:
    name: Build installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          fi
          echo "Build version: $(cat VERSION)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate icons
        run: python packaging\make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller packaging\windows\eqsl_win.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: Releases/*.exe
          if-no-files-found: error

  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -m "not gui"

  release:
    name: Publish GitHub Release
    needs: [linux, windows, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect artifacts and generate checksums
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' \) -exec cp {} upload/ \;
          python3 packaging/make_checksums.py upload

      - name: Show collected artifacts
        run: ls -R upload

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          generate_release_notes: true
